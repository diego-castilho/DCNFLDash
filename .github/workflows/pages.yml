name: Publicar painel

# POR QUÊ: o painel precisa abrir do celular sem depender de nenhuma máquina.
# QUANDO: a cada push em main — inclusive os commits de dados feitos pelo sync.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          mkdir -p _site/dados
          cp dados/*.json _site/dados/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
