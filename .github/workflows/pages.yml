name: Publicar painel

# POR QUÊ: o painel precisa abrir do celular sem depender de nenhuma máquina.
# QUANDO: a cada push humano em main, e — via workflow_call — logo depois de o sync
# commitar dados novos.
#
# ATENÇÃO, e é a razão de existir o workflow_call: push feito pelo GITHUB_TOKEN de
# uma Action NÃO dispara outros workflows. É regra do GitHub, para evitar recursão
# infinita. Sem isso, o sync commitava dados novos e o painel publicado continuava
# parado no dia anterior, sem nenhum erro em lugar nenhum.

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # actions: read é o que o deploy-pages usa para LISTAR o artefato do run. Sem ele a
  # API responde vazio e a action falha dizendo que não achou o "github-pages" — mesmo
  # com o upload bem-sucedido e o artefato visível na interface. Declarar um bloco de
  # permissions zera tudo que não está listado, então esquecer esta linha é silencioso.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ref: main explícito, e não o SHA do evento. Quando este workflow é chamado
      # pelo sync, o SHA do run é o de ANTES do commit de dados — sem isto o deploy
      # publica exatamente a versão que o sync acabou de substituir, e o painel fica
      # um ciclo atrás para sempre, com tudo verde no Actions.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with: { node-version: "22" }

      - name: Montar o site
        run: node scripts/montar.mjs

      # Deixa no log o que está indo ao ar. Se algum dia o painel publicado divergir
      # do repositório de novo, esta linha diz na hora qual das duas pontas errou.
      - name: Conferir o que vai ao ar
        run: |
          node -e "
            const t = require('./_site/dados/temporada.json');
            console.log('publicando: verificadoEm ' + t.verificadoEm + ' · atualizadoEm ' + t.atualizadoEm);
          "
          git log -1 --format='commit publicado: %h %s'

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }

      # O deploy-pages localiza o artefato consultando a API de artefatos do run, e essa
      # listagem não fica disponível no mesmo instante em que o upload termina. Quando o
      # deploy pergunta antes de o índice alcançar, ele recebe zero resultados e falha
      # dizendo que o artefato não existe — apesar de o upload ter dado certo e de o
      # arquivo aparecer normalmente segundos depois.
      #
      # Começou a acontecer em 22/11/2026, de forma intermitente, e virou regra em 24/11.
      # Este passo só espera a API enxergar o que acabou de ser enviado. Se o tempo
      # estourar, deixa seguir assim mesmo: o deploy dá a sua própria mensagem de erro,
      # e é melhor do que mascarar um problema diferente.
      - name: Esperar o artefato aparecer na API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 20); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" -q .total_count 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then
              echo "artefato visível na API na tentativa $i"
              exit 0
            fi
            echo "ainda não indexado (tentativa $i de 20) — esperando 5s"
            sleep 5
          done
          echo "::warning::o artefato não apareceu na API em 100s; seguindo para o deploy mesmo assim"
      - id: deploy
        uses: actions/deploy-pages@v5
