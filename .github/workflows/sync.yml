name: Sync ESPN

# POR QUÊ: placar, horário e confronto são informação determinística — vêm de uma
# API e não podem depender de alguém (ou de um modelo) transcrever à mão.
# QUANDO: de 30 em 30 minutos nas janelas de jogo, e uma vez por dia no resto.
# ONDE: no GitHub, não na máquina do Diego — o painel não pode depender do Mac ligado.

on:
  schedule:
    - cron: "*/30 16-23 * * 0"   # domingo, 13h às 20h de Brasília
    - cron: "*/30 0-6 * * 1"     # madrugada de domingo para segunda (SNF)
    - cron: "*/30 23 * * 1"      # segunda à noite (MNF)
    - cron: "*/30 0-6 * * 2"     # madrugada de segunda para terça (fim do MNF)
    - cron: "0 11 * * *"         # varredura diária, 8h de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.commit.outputs.mudou }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Buscar dados da ESPN
        run: node scripts/sync-espn.mjs

      - name: Validar antes de gravar
        run: node scripts/validar.mjs

      - name: Commitar se algo mudou
        id: commit
        run: |
          git config user.name "dcnfldash-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- dados/; then
            echo "nada mudou"
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mudou=true" >> "$GITHUB_OUTPUT"
          resumo=$(node -e "
            const l=require('./dados/mudancas.json');
            const e=(l.entradas||[])[0];
            const recente = e && (Date.now()-Date.parse(e.quando) < 36e5);
            const m = recente ? e.mudancas : [];
            const c = t => m.filter(x=>x.tipo===t).length;
            const p=[[c('placar final'),'placar(es)'],[c('horário alterado'),'horário(s)'],[c('jogo novo'),'jogo(s) novo(s)']];
            console.log(p.filter(x=>x[0]).map(x=>x.join(' ')).join(', ') || 'verificação diária');
          ")
          git add dados/
          git commit -m "dados: sync ESPN — $resumo"
          git push

  # O push acima é feito com o GITHUB_TOKEN e por isso não dispara o workflow de
  # publicação sozinho. Chamamos ele aqui, explicitamente.
  publicar:
    needs: sync
    if: needs.sync.outputs.mudou == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
